name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager \
            --sdk_root="$SDK_ROOT" \
            --licenses >/dev/null || true

          sdkmanager \
            --sdk_root="$SDK_ROOT" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test, lint and build
        run: |
          ./gradlew \
            testDebugUnitTest \
            lintDebug \
            lintRelease \
            assembleDebug \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=2
